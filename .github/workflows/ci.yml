name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install sandbox runner deps (bubblewrap 0.12.0 from source; apt's 0.9.0 lacks --overlay-src)
        run: bash scripts/ci-runner-deps.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:types
      - run: npm run check:primitives
      - name: Test (a skipped test fails CI — a skip is not a pass)
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
          grep -qx '# skipped 0' /tmp/test.log || { echo "::error::tests were skipped; a skip is not a pass"; grep '# SKIP' /tmp/test.log; exit 1; }
