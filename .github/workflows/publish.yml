# Canonical npm publish workflow — copy to `.github/workflows/publish.yml`.
#
# npm trusted publishing via OIDC (no NPM_TOKEN), idempotent (skips a version
# already on the registry), and it asserts the END STATE rather than trusting
# npm's exit code.
#
# Manual by default: it runs only when you click "Run workflow" (or via the
# CLI). To also auto-publish when you cut a GitHub Release, add back:
#   release:
#     types: [published]
#
# Before the first run: configure the trusted publisher at npmjs.com
# (Package settings → Trusted Publisher → GitHub Actions: your repo + this
# workflow file). `prepack` (or `prepublishOnly`) builds the .d.ts into the
# tarball at publish; the "Build types" step below covers repos that use
# neither. Typed repos: the adopter gate below needs your own quickstart —
# see the PER-REPO block.
name: Publish to npm

on:
  workflow_dispatch:        # manual "Run workflow" button — publish when you want

permissions:
  contents: read
  id-token: write           # required: lets npm mint OIDC credentials

concurrency:                # never let two publish runs race
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Native-addon repos (e.g. better-sqlite3) may need `20` instead if the
          # pinned addon ships no prebuilt for the Node 22 ABI. npm@11 (below)
          # supports both 20 and 22, so only this line changes.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        # Pinned to a major, NOT @latest: a floating npm eventually raises its Node
        # floor above the runner's version and fails with EBADENGINE (npm@12 dropped
        # Node 20). npm@11 is >= 11.5.1 for OIDC and runs on both Node 20 and 22.
        #
        # Native-addon repos on npm@12+ (Node 22+ only): npm@12 ALSO blocks
        # dependency install-scripts by default, so `npm ci` silently skips native
        # builds (better-sqlite3, node-gyp) and ships a module that crashes at
        # runtime, not at install. To move to npm@12, commit an `allowScripts`
        # allowlist (`npm approve-scripts --all --no-allow-scripts-pin`, then review)
        # and add `--strict-allow-scripts` to the install below so an unapproved
        # script fails the run loudly. Pure-JS repos are unaffected — stay on npm@11.
        #
        # CAVEAT — do NOT move a PUBLISHING workflow to npm@12 yet: npm 12.0.0's
        # `npm publish --provenance` is broken (its libnpmpublish provenance.js does
        # `require('sigstore')` but the tarball bundles only the `@sigstore/*` scoped
        # packages → publish dies MODULE_NOT_FOUND). npm@11 bundles `sigstore` and
        # publishes fine. Stay on npm@11 here until npm ships a fix; the allowScripts
        # allowlist can already ride in package.json for end users on npm 12.
        run: npm install -g npm@11
      - name: Install dependencies
        # Use `npm ci` when a lockfile is present (reproducible installs for
        # projects with dependencies). Dependency-free repos have no
        # package-lock.json — `npm ci` errors there (EUSAGE), so fall back to
        # `npm install` (a fast no-op when there's nothing to install).
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Lockfile version matches package.json
        # `npm ci` above already fails when the lockfile's DEPENDENCY entries
        # disagree with package.json; it does not check the lockfile's copy of
        # this project's own version. A release that bumps package.json without
        # running an install leaves that field behind, and nothing caught it —
        # measured in bareguard, stale across three consecutive releases.
        # No-ops via --if-present in a repo that has not added the script.
        run: npm run check:lockfile --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      # Same runner deps as ci.yml: the sandbox suites need bwrap + socat, and
      # Ubuntu's AppArmor blocks unprivileged user namespaces unless relaxed.
      - name: Install sandbox runner deps (bubblewrap 0.12.0 from source; apt's 0.9.0 lacks --overlay-src)
        run: |
          sudo apt-get install -y socat curl openssl meson ninja-build libcap-dev pkg-config
          curl -sSfL -o /tmp/bwrap.tar.xz https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz
          echo "9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314  /tmp/bwrap.tar.xz" | sha256sum -c -
          tar -xJf /tmp/bwrap.tar.xz -C /tmp
          meson setup /tmp/bwrap-build /tmp/bubblewrap-0.12.0 --prefix=/usr -Dman=disabled -Dtests=false -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          ninja -C /tmp/bwrap-build
          sudo ninja -C /tmp/bwrap-build install
          bwrap --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test (a skipped test fails CI — a skip is not a pass)
        run: |
          set -o pipefail
          npm test --if-present 2>&1 | tee /tmp/test.log
          grep -qx '# skipped 0' /tmp/test.log || { echo "::error::tests were skipped; a skip is not a pass"; grep '# SKIP' /tmp/test.log; exit 1; }
      - name: Skip if this version is already on npm
        # BEFORE the pack-and-install gate below, not after: re-dispatching a publish
        # for a version already on the registry is the idempotency case this step
        # exists for, and it should cost a `npm view`, not a tarball build plus a
        # TypeScript install. Everything downstream is gated on its output.
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "::notice::$NAME@$VERSION already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build types
        # `npm pack` does not run `prepublishOnly`, so without this the adopter
        # check below would pack a tarball with no `.d.ts`; repos that use
        # `prepack` instead get it automatically and this is a no-op.
        if: steps.check.outputs.skip == 'false'
        run: npm run build:types --if-present
      - name: Types are usable BY AN ADOPTER, not just internally
        # `tsc --noEmit` in Typecheck above checks the SOURCE; it cannot see the
        # generated .d.ts resolved from inside node_modules, which is the one
        # thing adopters consume. This packs, installs the tarball into a clean
        # consumer project, and compiles a quickstart against it — the only
        # workflow that puts bytes on the registry is the one place this check
        # cannot be skipped.
        #
        # Untyped repos (no `types` field, no `types/` dir) short-circuit below —
        # there's nothing for an adopter to type-check. NOTE the `types` FIELD is
        # checked too, not just a `types/` dir: packages that ship a root
        # `./index.d.ts` (no types/ dir) are typed and must NOT short-circuit.
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ ! -d types ] && [ -z "$(node -p "require('./package.json').types || ''")" ]; then
            echo "::notice::no types shipped — skipping adopter type check"
            exit 0
          fi
          NAME=$(node -p "require('./package.json').name")
          # Pin @types/node to the major THIS package builds against, don't float.
          # Measured: an unpinned `@types/node` resolved to 26.x against a package
          # built on ^22, and Node 26's stricter EventMap typing failed a shipped
          # .d.ts with TS2344 — a red publish gate caused by a third-party release,
          # not by anything in the commit being published. Floating here makes every
          # repo's ability to publish depend on DefinitelyTyped's release schedule.
          # Derived from devDependencies, falling back to `engines.node`, so this
          # stays generic; forward-compat against a newer @types/node is worth
          # testing, but in ci.yml where a failure doesn't block shipping.
          TYPES_NODE=$(node -p "
            const p=require('./package.json');
            const d=(p.devDependencies||{})['@types/node'];
            if (d) process.stdout.write(d);
            else {
              const e=((p.engines||{}).node||'').match(/(\d+)/);
              process.stdout.write(e ? '^'+e[1] : 'latest');
            }
            ''")
          echo "pinning @types/node to: $TYPES_NODE"
          mkdir -p /tmp/pkg /tmp/consumer
          npm pack --pack-destination /tmp/pkg
          cd /tmp/consumer
          # `"type": "module"` here is deliberate and covers BOTH shapes: an ESM
          # consumer importing a CommonJS package is the harder direction and the
          # one that catches a missing/!misordered `exports.types` condition.
          # Verified against a `"type":"commonjs"` package with 7 subpaths.
          cat > package.json <<'JSON'
          { "name": "consumer", "private": true, "type": "module" }
          JSON
          # Do NOT add `skipLibCheck: true` here. Measured: with it on, a package
          # whose shipped .d.ts is genuinely broken (a declaration file missing from
          # the tarball) compiles CLEAN — exit 0 — and publishes. With it off the
          # same package fails. Every repo's OWN tsconfig sets skipLibCheck:true,
          # so its absence here looks like an oversight; it is the entire point.
          # That asymmetry is why this gate catches what `npm run typecheck` cannot.
          cat > tsconfig.json <<'JSON'
          { "compilerOptions": { "strict": true, "module": "nodenext",
            "moduleResolution": "nodenext", "target": "es2022",
            "noEmit": true, "types": ["node"], "resolveJsonModule": true } }
          JSON
          # ── PER-REPO: barebox minimal usage (mirrors README quickstart) ──
          # resolveJsonModule is required: adopters import the primitives
          # manifest subpath as JSON, and the gate must prove that resolves.
          cat > app.ts <<EOF
          import { launch, createProxy } from "barebox";
          import manifest from "barebox/primitives.json" with { type: "json" };
          const child = launch({ runtime: "/tmp/sbx", agent: "fx", proj: "/tmp/proj", command: ["true"] });
          const code: number | null = child.exitCode;
          const proxy = createProxy({ port: 3129, certDir: "./certs", logFile: "./mitm.log" });
          const queued: number = proxy.pending().length;
          const names: string[] = manifest.primitives.map((p) => p.name);
          proxy.close();
          EOF
          # ── end PER-REPO ──
          # `--ignore-scripts` is REQUIRED here, not hygiene. This job holds
          # `id-token: write` — the OIDC credential that can publish this package to
          # npm. Without the flag, every install script in the tarball's whole
          # dependency tree executes inside that job, so one compromised transitive
          # dependency could mint a publish token. The gate only ever runs `tsc`,
          # which reads .d.ts files and nothing else, so nothing here needs to be
          # built: measured on a native-addon package, the addon is NOT compiled
          # (no build/Release/*.node) and the type check still passes, while a broken
          # dereference still fails it. Do not drop the flag to "fix" a native repo —
          # if a package genuinely needs its addon built to type-check, that is a bug
          # in its .d.ts, not a reason to run untrusted scripts next to a publish
          # credential.
          #
          # `typescript@5` is pinned to a major for the same reason `@types/node` is:
          # an unpinned compiler silently becomes a new major and fails the gate on
          # its own schedule rather than on this commit's merits.
          #
          # Peer deps are NOT pulled in when marked optional via peerDependenciesMeta
          # (measured: identical package count with and without --omit=peer), so no
          # flag is needed for them.
          npm install --no-audit --no-fund --ignore-scripts /tmp/pkg/*.tgz typescript@5 "@types/node@$TYPES_NODE"
          ./node_modules/.bin/tsc
      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: |
          # npm's OIDC trusted-publishing flow can exit non-zero from a trailing
          # "generate Web Auth URLs" call (HTTP 401) AFTER the tarball +
          # provenance have already been committed to the registry — making the
          # step go red on a publish that actually succeeded. So don't trust the
          # exit code: run the publish, then assert the END STATE (is the version
          # on the registry?). A genuine failure — where the version is NOT on
          # npm AND npm exited non-zero — still fails the step. (A blanket
          # `|| true` would instead hide real failures, which is worse.)
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISH_EXIT=0
          npm publish --provenance --access public || PUBLISH_EXIT=$?
          # Registry read-after-write can lag well past 15s. Poll generously
          # (~2 min) so the end-state check doesn't false-negative a publish that
          # actually succeeded. `npm view` caches, so --prefer-online bypasses it.
          PUBLISHED=""
          for _ in $(seq 1 20); do
            PUBLISHED=$(npm view "$NAME@$VERSION" version --prefer-online 2>/dev/null || true)
            [ "$PUBLISHED" = "$VERSION" ] && break
            sleep 6
          done
          if [ "$PUBLISHED" = "$VERSION" ]; then
            # End state confirmed. If npm exited non-zero, that's the OIDC-401
            # case above — downgrade to a warning.
            if [ "$PUBLISH_EXIT" -ne 0 ]; then
              echo "::warning::npm publish exited $PUBLISH_EXIT but $NAME@$VERSION is on the registry (known npm OIDC post-publish web-auth 401); treating as success."
            fi
            echo "✅ Published $NAME@$VERSION"
          elif [ "$PUBLISH_EXIT" -eq 0 ]; then
            # npm reported success (exit 0 = the upload HTTP call succeeded) but
            # the registry still isn't reflecting it after the poll window. Trust
            # the success exit here — the benign inverse of the OIDC-401 case.
            echo "::warning::npm publish exited 0 but $NAME@$VERSION not yet visible after ~2 min (registry reflection lag); treating as success."
            echo "✅ Published $NAME@$VERSION (npm exit 0; registry lagging)"
          else
            echo "::error::npm publish failed (exit $PUBLISH_EXIT) and $NAME@$VERSION is NOT on the registry."
            exit 1
          fi
